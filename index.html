<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Life OS - Fuad.B</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="icon-192.png">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Inter+Tight:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=25">
</head>

<body data-theme="dark">

    <canvas id="confetti-canvas"></canvas>
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

    <div class="sidebar sbx" id="sidebar">
        <div class="sbx-brand">
            <div class="sbx-title">Life<i>OS</i></div>
            <button class="sbx-ibtn" id="theme-btn" onclick="QuizApp.toggleTheme()" title="Temanı dəyiş">☀️</button>
        </div>

        <label class="sbx-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
            <input type="search" id="sb-answer-search-input" placeholder="Cavab axtar…" aria-label="Cavab axtarışı" onkeypress="if(event.key==='Enter') QuizApp.performSidebarAnswerSearch()">
            <button type="button" class="sbx-enter" onclick="QuizApp.performSidebarAnswerSearch()" title="Axtar">↵</button>
        </label>

        <div class="sbx-scroll">
            <button class="menu-btn active" id="btn-home" onclick="QuizApp.showHomeFromSidebar()">
                <svg class="sbx-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"></path><path d="M5 10v10h14V10"></path></svg>
                <span>Ana səhifə</span>
            </button>
            <div class="course-list" id="sidebar-list">
                <!-- Main.js will render App Switcher and Sub-menus here -->
            </div>
        </div>

        <div class="sbx-foot">
            <div class="sbx-acc" id="sbx-acc"></div>
            <div class="sbx-sw">
                <div class="sbx-sw-lbl"><span class="sbx-cap">Xronometr</span><b id="sb-timer-display">00:00:00</b></div>
                <button class="sbx-ibtn" id="sb-timer-reset" onclick="SidebarTimer.reset()" title="Sıfırla" aria-label="Sıfırla">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg>
                </button>
                <button class="sbx-go" id="sb-timer-start" onclick="SidebarTimer.toggle()" title="Başla / dayandır">Başla</button>
            </div>
            <div class="daily-box sbx-goal">
                <div class="daily-header">
                    <span id="daily-label">GÜNLÜK HƏDƏF</span><span id="daily-text">0/500</span>
                </div>
                <div class="daily-track">
                    <div class="daily-fill" id="daily-bar"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="main">
        <div class="mobile-header">
            <button onclick="toggleSidebar()"
                style="background:none; border:none; color:var(--text-main); font-size:1.5rem;">☰</button>
            <span style="font-weight:700;">Life OS</span>
            <div style="width:24px;"></div>
        </div>

        <div class="top-nav" id="top-nav" style="display:none;"></div>
        <div class="content-area" id="content-area">
            <!-- Dynamic Content -->
        </div>
    </div>

    <template id="quiz-template">
        <div class="card quiz-a">
            <div class="card-header-section">
                <div id="subject-nav"
                    style="display:flex; gap:10px; overflow-x:auto; margin-bottom:15px; padding-bottom:5px; scrollbar-width:none;">
                </div>

                <div class="qa-head">
                    <button class="qa-icon" onclick="QuizApp.showCourseDashboard(QuizApp.state.course)" title="Fənn səhifəsinə qayıt" aria-label="Bağla">✕</button>
                    <button class="qa-bar" onclick="QuizApp.togglePager()" title="Sualların siyahısını aç" aria-label="Sualların siyahısı"><i id="qa-bar-fill"></i></button>
                    <span class="qa-count" id="qa-count"></span>
                    <span class="qa-timer" id="quiz-timer-disp">00:00</span>
                    <div class="action-icon" id="btn-star" onclick="toggleBookmark()" title="İşarələ">★</div>
                    <details class="qa-more">
                        <summary class="qa-icon" aria-label="Əlavə">⋯</summary>
                        <div class="qa-menu">
                            <button type="button" id="btn-speak" onclick="speakQuestion()">Səsləndir</button>
                            <button type="button" id="btn-flash" onclick="toggleFlashcard()">Flashcard rejimi</button>
                            <button type="button" id="btn-hint" onclick="hint()">İpucu</button>
                            <button type="button" onclick="QuizApp.confirmReset(this)">Testi sıfırla</button>
                        </div>
                    </details>
                </div>
                <div class="qa-cap"><span id="course-name-sm">...</span><span class="qa-sep">·</span><span id="title-unit">Yüklənir...</span></div>
                <span id="score-wrong-disp" hidden>0</span><span id="score-correct-disp" hidden>0</span>

                <div class="progress-track" id="progress-bar"></div>
            </div>

            <div class="question-box">
                <div id="q-meta" style="font-size: 0.82rem; color: var(--text-muted); font-weight: 600; margin-bottom: 12px; display: none; align-items: center; gap: 8px;"></div>
                <div class="question-text" id="q-text">...</div>
                <div id="flashcard-cover"
                    style="text-align:center; padding:40px; border:2px dashed var(--border); border-radius:12px; margin-bottom:20px; display:none;"
                    onclick="revealFlashcard()">
                    <h3>🃏 Toxun və Gör</h3>
                </div>
                <div id="opt-list"></div>
            </div>

            <div class="qa-foot" id="qa-foot"></div>
        </div>
    </template>

    <template id="search-template">
        <div class="cp">
            <div class="cp-head">
                <div class="cp-head-l">
                    <button class="qa-icon" onclick="QuizApp.start()" title="Ana səhifə" aria-label="Ana səhifə">←</button>
                    <div><h1>Doğru cavab axtarışı</h1><p>Yazdığınız söz yalnız sualların doğru cavabında axtarılır</p></div>
                </div>
            </div>
            <div class="cp-search">
                <input type="text" id="answer-search-input" class="cp-field" placeholder="Axtarmaq istədiyiniz sözü yazın..." onkeypress="if(event.key==='Enter') QuizApp.performAnswerSearch()">
                <button class="btn btn-pri" onclick="QuizApp.performAnswerSearch()" title="Axtar" aria-label="Axtar">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
            </div>
            <div id="search-results-info" class="cp-advice" style="display:none;"></div>
            <div id="search-results-list" style="display:flex; flex-direction:column; gap:12px;"></div>
        </div>
    </template>


    <div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
        <div class="modal-box">
            <div
                style="display:flex; justify-content:space-between; margin-bottom:15px; border-bottom:1px solid var(--border); padding-bottom:10px;">
                <h3 id="modal-title" style="margin:0;">Nəticə</h3>
                <button onclick="closeModal()"
                    style="background:none; border:none; color:var(--text-main); font-size:1.2rem;">✕</button>
            </div>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- Surprise Question Modal Overlay -->
    <div class="modal-overlay" id="surprise-modal-overlay" style="display:none; justify-content:center; align-items:center; z-index:2000;">
        <div class="modal-box surprise-box" style="position:relative; max-width:550px; width:90%; padding:28px; border-radius:24px; background:var(--bg-card); border:1px solid var(--border); box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
            <div class="surprise-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:1px solid var(--border); padding-bottom:12px;">
                <div style="display:flex; align-items:center; gap:8px;">
                    <span style="font-size:1.5rem;">🎁</span>
                    <h3 style="margin:0; font-family:'Plus Jakarta Sans', sans-serif; font-weight:800; background:linear-gradient(135deg, #f59e0b 0%, #f97316 100%); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;">Sürpriz Sual!</h3>
                </div>
                <div style="display:flex; align-items:center; gap:8px;">
                    <div id="surprise-timer" style="font-family:'Plus Jakarta Sans', sans-serif; font-weight:800; font-size:1.1rem; color:#ef4444; background:rgba(239,68,68,0.1); padding:4px 10px; border-radius:8px; border:1px solid rgba(239,68,68,0.2);">30s</div>
                    <button class="qa-icon" onclick="QuizApp.dismissSurpriseModal()" title="Bağla" aria-label="Bağla">✕</button>
                </div>
            </div>
            <div class="surprise-content">
                <div id="surprise-meta" style="font-size:0.8rem; color:var(--text-muted); font-weight:700; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:10px;"></div>
                <div id="surprise-question-text" style="font-size:1.1rem; font-weight:600; color:var(--text-main); margin-bottom:20px; line-height:1.5;"></div>
                <div id="surprise-options-list" style="display:flex; flex-direction:column; gap:10px; margin-bottom:20px;"></div>
            </div>
            <div id="surprise-feedback" style="display:none; text-align:center; font-weight:800; font-size:1.05rem; margin-bottom:20px; padding:12px; border-radius:14px; font-family:'Plus Jakarta Sans', sans-serif;"></div>
            <div class="surprise-footer" id="surprise-footer" style="display:none; justify-content:flex-end;">
                <button class="btn btn-pri" onclick="QuizApp.closeSurpriseModal()" style="width:100%; padding:12px; border-radius:12px; font-weight:700; background:var(--accent-gradient);">Davam Et</button>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <script src="data.js?v=4"></script>
    <script src="testsuallari/ataaof_sorular_data.js?v=4"></script>
    <script src="testsuallari/pdf_exams_data.js?v=4"></script>
    <script src="config.js?v=6"></script>
    <script src="firebase.js?v=7"></script>
    <script src="quiz.js?v=24"></script>
    <script src="main.js?v=5"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('Service Worker qeydiyyatdan keçdi:', reg.scope))
                    .catch((err) => console.log('Service Worker qeydiyyat xətası:', err));
            });
        }
    </script>
</body>

</html>
